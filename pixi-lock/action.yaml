name: Pixi lock
description: Get or create the pixi.lock
inputs:
  cache:
    description: Whether to enable caching of the lock-file
    required: true
    default: "true"
  pixi-version:
    description: The version of pixi to use
    required: false
  pixi-manifest-path:
    description: The path to the pixi manifest file
    required: false

runs:
  using: "composite"
  steps:
    - name: Set TODAY
      id: set-today
      shell: bash -e {0}
      run: |
        echo "TODAY=$(command date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: "1"
        persist-credentials: false
    - if: inputs.cache == 'true'
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pixi.lock
        key: pixi|${{ steps.set-today.outputs.TODAY }}|${{ hashFiles('pixi.toml') }}
    - name: Check cached lock
      id: check
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash -e {0}
      run: |
        # Builds on a dev label can be removed after the lock was cached,
        # and installing from that lock then fails, so solve it again
        for url in $(grep -oE 'https://conda.anaconda.org/[^ ]+/label/dev/[^ ]+[.](conda|tar[.]bz2)' pixi.lock | sort -u); do
          if ! curl -sfIL -o /dev/null "$url"; then
            echo "::warning::$url is no longer available, solving the lock again"
            echo "stale=true" >> $GITHUB_OUTPUT
            break
          fi
        done
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      if: steps.cache.outputs.cache-hit != 'true' || steps.check.outputs.stale == 'true'
      with:
        pixi-version: ${{ inputs.pixi-version }}
        manifest-path: ${{ inputs.pixi-manifest-path }}
        run-install: false
    - name: Lock
      if: steps.cache.outputs.cache-hit != 'true' || steps.check.outputs.stale == 'true'
      shell: bash -e {0}
      env:
        STALE: ${{ steps.check.outputs.stale }}
      run: |
        # pixi lock keeps what an existing lock pins, so drop the stale one
        if [ "$STALE" = "true" ]; then rm pixi.lock; fi
        pixi lock --color=always
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pixi-lock
        path: pixi.lock
        if-no-files-found: error
    - if: inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pixi.lock
        key: pixi|${{ steps.set-today.outputs.TODAY }}|${{ hashFiles('pixi.toml') }}
