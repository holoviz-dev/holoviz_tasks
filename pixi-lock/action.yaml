name: Pixi lock
description: Get or create the pixi.lock
inputs:
  cache:
    description: Whether to enable caching of the lock-file
    required: true
    default: "true"
  pixi-version:
    description: The version of pixi to use
    required: false
  pixi-manifest-path:
    description: The path to the pixi manifest file
    required: false

runs:
  using: "composite"
  steps:
    - name: Set TODAY
      id: set-today
      shell: bash -e {0}
      run: |
        echo "TODAY=$(command date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: "1"
        persist-credentials: false
    - if: inputs.cache == 'true'
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pixi.lock
        key: pixi|${{ steps.set-today.outputs.TODAY }}|${{ hashFiles('pixi.toml') }}
    - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        pixi-version: ${{ inputs.pixi-version }}
        manifest-path: ${{ inputs.pixi-manifest-path }}
        run-install: false
    - name: Lock
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash -e {0}
      run: |
        pixi lock --color=always
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pixi-lock
        path: pixi.lock
        if-no-files-found: error
    - if: inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pixi.lock
        key: pixi|${{ steps.set-today.outputs.TODAY }}|${{ hashFiles('pixi.toml') }}
